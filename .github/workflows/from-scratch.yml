name: Aidict clean rewrite APK
on:
  push:
    branches: [rewrite/from-scratch]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android
        run: |
          flutter create --no-pub --platforms android --org com.explapp --project-name aidict .
          rm -f test/widget_test.dart
      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          c = p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36').replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          p.write_text(c)
          assert 'compileSdk = 36' in c and 'minSdk = 23' in c
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in xml:
              xml = xml.replace('<application', permission + ' <application', 1)
          for name in ['android.permission.CAMERA', 'android.permission.RECORD_AUDIO']:
              permission = '<uses-permission android:name="' + name + '" />'
              if permission not in xml:
                  xml = xml.replace('<application', permission + ' <application', 1)
          queries = ('<queries>'
                     '<intent><action android:name="android.speech.RecognitionService" /></intent>'
                     '<intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>'
                     '</queries>')
          if '<queries' not in xml:
              xml = xml.replace('<application', queries + ' <application', 1)
          manifest.write_text(xml)
          assert 'android:name="flutterEmbedding"' in xml
          assert 'android:value="2"' in xml
          PY
      - name: Resolve
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --debug
      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Report build failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Clean rebuild failed. Inspect the exact failed job at: https://github.com/%s/actions/runs/%s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > rewrite-failure.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Clean rewrite build failed: $GITHUB_RUN_ID" --body-file rewrite-failure.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aidict-From-Scratch-Debug-APK
          path: rewrite/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
