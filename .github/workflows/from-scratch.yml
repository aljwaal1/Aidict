name: Aidict clean rewrite APK
on:
  push:
    branches: [rewrite/from-scratch]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android
        run: |
          flutter create --no-pub --platforms android --org com.explapp --project-name aidict .
          rm -f test/widget_test.dart
      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          c = p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36').replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          p.write_text(c)
          assert 'compileSdk = 36' in c and 'minSdk = 23' in c
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in xml:
              xml = xml.replace('<application', permission + ' <application', 1)
          for name in ['android.permission.CAMERA', 'android.permission.RECORD_AUDIO']:
              permission = '<uses-permission android:name="' + name + '" />'
              if permission not in xml:
                  xml = xml.replace('<application', permission + ' <application', 1)
          queries = ('<queries>'
                     '<intent><action android:name="android.speech.RecognitionService" /></intent>'
                     '<intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>'
                     '</queries>')
          if '<queries' not in xml:
              xml = xml.replace('<application', queries + ' <application', 1)
          manifest.write_text(xml)
          assert 'android:name="flutterEmbedding"' in xml
          assert 'android:value="2"' in xml
          PY
      - name: Check optional Python backend syntax
        run: python3 -m py_compile backend/app.py
      - name: Bundle on-device Arabic and English OCR models
        run: |
          mkdir -p assets/tessdata
          for lang in ara eng; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${lang}.traineddata" \
              --output "assets/tessdata/${lang}.traineddata"
            test "$(wc -c < "assets/tessdata/${lang}.traineddata")" -gt 100000
          done
          test -s assets/tessdata_config.json
      - name: Resolve
        run: flutter pub get
      - name: Patch obsolete Android plugin repositories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          cache=Path.home()/'.pub-cache'/'hosted'/'pub.dev'
          for plugin in cache.glob('tesseract_ocr-*/android/build.gradle'):
              data=plugin.read_text()
              data=data.replace('jcenter()', 'mavenCentral()')
              data=data.replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17')
              data=data.replace('jvmTarget = "11"', 'jvmTarget = "17"')
              data=data.replace("jvmTarget = '11'", "jvmTarget = '17'")
              data += chr(10) + "afterEvaluate { tasks.withType(JavaCompile).configureEach { sourceCompatibility = '17'; targetCompatibility = '17' } }" + chr(10)
              plugin.write_text(data)
              print(f'Patched: {plugin}')
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --debug
      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Report build failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Clean rebuild failed. Inspect the exact failed job at: https://github.com/%s/actions/runs/%s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > rewrite-failure.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Clean rewrite build failed: $GITHUB_RUN_ID" --body-file rewrite-failure.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aidict-From-Scratch-Debug-APK
          path: rewrite/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
