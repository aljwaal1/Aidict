name: Aidict Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: |
          flutter create --platforms android --org com.explapp --project-name ai_translator .
          # Flutter's sample widget test targets MyApp; Aidict uses AidictApp.
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          for permission in ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO']:
              if not any(e.get(ns+'name') == permission for e in root.findall('uses-permission')):
                  root.insert(0, ET.Element('uses-permission', {ns+'name':permission}))
          app = root.find('application')
          queries = root.find('queries')
          if queries is None:
              queries = ET.Element('queries')
              root.insert(0, queries)
          recognition = ET.SubElement(queries, 'intent')
          ET.SubElement(recognition, 'action', {ns+'name':'android.speech.RecognitionService'})
          tts = ET.SubElement(queries, 'intent')
          ET.SubElement(tts, 'action', {ns+'name':'android.intent.action.TTS_SERVICE'})
          tree.write(manifest, encoding='unicode', xml_declaration=True)
          gradle = Path('android/app/build.gradle.kts')
          gradle.write_text(gradle.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23'))
          PY
          python3 tools/validate_project.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aidict-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
