name: Aidict Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: |
          flutter create --no-pub --platforms android --org com.explapp --project-name ai_translator .
          # Flutter's sample widget test targets MyApp; Aidict uses AidictApp.
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          for permission in ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO', 'android.permission.CAMERA']:
              if not any(e.get(ns+'name') == permission for e in root.findall('uses-permission')):
                  root.insert(0, ET.Element('uses-permission', {ns+'name':permission}))
          app = root.find('application')
          queries = root.find('queries')
          if queries is None:
              queries = ET.Element('queries')
              root.insert(0, queries)
          recognition = ET.SubElement(queries, 'intent')
          ET.SubElement(recognition, 'action', {ns+'name':'android.speech.RecognitionService'})
          tts = ET.SubElement(queries, 'intent')
          ET.SubElement(tts, 'action', {ns+'name':'android.intent.action.TTS_SERVICE'})
          tree.write(manifest, encoding='unicode', xml_declaration=True)
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          text = text.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
          gradle.write_text(text)
          PY
          grep -nE 'compileSdk|minSdk' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          f = Path('android/app/build.gradle.kts').read_text()
          assert 'compileSdk = 36' in f, 'Android compile SDK must be 36'
          assert 'minSdk = 23' in f, 'Minimum SDK must be 23'
          PY
          python3 tools/validate_project.py
      - name: Static architecture regression checks
        run: python3 tools/architecture_guard.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify dependency APIs
        run: |
          python3 tools/architecture_guard.py
          flutter pub deps --style=compact | grep -E 'file_picker|flutter_tts|google_mlkit_translation'
      - name: Show environment and dependency diagnostics
        if: failure()
        run: |
          flutter --version
          flutter doctor -v
          flutter pub deps || true
      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee flutter-analyze.log
      - name: Write analyzer errors to job summary
        if: always()
        shell: bash
        run: |
          if [ -f flutter-analyze.log ]; then
            {
              echo "## Flutter Analyze errors"
              echo '~~~text'
              grep -E '(^| )(error|warning) •|error:|Error:' flutter-analyze.log | head -80 || tail -80 flutter-analyze.log
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee flutter-test.log
      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee flutter-build.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aidict-build-diagnostics
          path: |
            flutter-analyze.log
            flutter-test.log
            flutter-build.log
            pubspec.lock
            android/app/build.gradle.kts
            android/app/src/main/AndroidManifest.xml
          if-no-files-found: ignore
      - name: Create actionable failure report
        if: ${{ always() && (steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYZE_RESULT: ${{ steps.analyze.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = [
              '# Aidict CI diagnostics',
              f"Run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Analyze: {os.environ['ANALYZE_RESULT']}; Test: {os.environ['TEST_RESULT']}; Build: {os.environ['BUILD_RESULT']}",
          ]
          for filename in ('flutter-analyze.log','flutter-test.log','flutter-build.log'):
              file = Path(filename)
              if not file.exists():
                  continue
              text = file.read_text(errors='replace').splitlines()
              selected = [v for v in text if ('error •' in v or 'Error:' in v or 'FAIL' in v or 'Exception' in v)]
              excerpt = (selected[:80] + ['--- Last 100 lines ---'] + text[-100:])
              lines.extend(['', f'## {filename}', '```text', *excerpt, '```'])
          Path('ci-failure-report.md').write_text('\n'.join(lines))
          PY
          gh issue create --title "CI failure: run ${GITHUB_RUN_ID}" --body-file ci-failure-report.md
      - name: Assert quality gates
        if: always()
        env:
          ANALYZE_RESULT: ${{ steps.analyze.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "Analyze: $ANALYZE_RESULT"
          echo "Test: $TEST_RESULT"
          echo "Build: $BUILD_RESULT"
          {
            echo "## Flutter quality gates"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Analyze | $ANALYZE_RESULT |"
            echo "| Test | $TEST_RESULT |"
            echo "| Build APK | $BUILD_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$ANALYZE_RESULT" = success &&
          test "$TEST_RESULT" = success &&
          test "$BUILD_RESULT" = success
      - name: Verify compiled APK
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload APK
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Aidict-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
