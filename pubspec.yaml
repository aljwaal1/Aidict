name: ai_translator
description: Aidict Arabic-English offline and multilingual online translator
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  google_mlkit_translation: ^0.13.0
  shared_preferences: ^2.5.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
