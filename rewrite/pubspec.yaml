name: aidict
description: Clean-room Android Flutter translator
publish_to: none
version: 0.1.1+2
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_mlkit_translation: ^0.13.0
  http: ^1.3.0
  shared_preferences: ^2.5.2
  image_picker: ^1.1.2
  image: ^4.5.4
  google_mlkit_text_recognition: ^0.15.0
  tesseract_ocr: ^0.5.0
  pdfx: ^2.11.0
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  syncfusion_flutter_pdf: ^34.2.7
  archive: ^4.5.2
  xml: ^7.0.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  llama_flutter_android: ^0.2.6
  sherpa_onnx: ^1.13.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/jordanian_words.json
    - assets/tessdata_config.json
    - assets/tessdata/
