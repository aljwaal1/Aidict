publish_to: none
version: 0.1.1+2
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_mlkit_translation: ^0.13.0
  http: ^1.3.0
  shared_preferences: ^2.5.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  file_selector: ^1.1.0
  file_picker: 10.3.10
  syncfusion_flutter_pdf: ^34.2.7
